name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Confirm Skills CLI discovery
        run: |
          npx --yes skills@1.5.23 add . --list | tee /tmp/skills-list.txt
          for skill in code-simplifier multi-angle-code-review plex-library-organizer streamline; do
            grep -F "$skill" /tmp/skills-list.txt
          done
      - name: Validate collection
        run: python3 scripts/validate_repo.py
      - name: Check Python syntax
        run: python3 -m compileall -q skills tests scripts
      - name: Run organizer unit tests
        run: python3 -m unittest discover -s tests -v

